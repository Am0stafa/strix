<!DOCTYPE html>
<!--
  CSPT fixture - Expected classification: positive (exploitable).
  Source: URL fragment (location.hash, a client hash router). Sink: fetch() path.
  The fragment is never sent to the server by the browser, so only a
  client-side trace shows the traversed request leaving the page.
-->
<html>
  <head><meta charset="utf-8" /><title>Item</title></head>
  <body>
    <pre id="item"></pre>
    <script>
      const userPath = location.hash.slice(1);
      fetch('/api/items/' + userPath)
        .then((r) => r.json())
        .then((data) => { document.getElementById('item').textContent = JSON.stringify(data); });
    </script>
  </body>
</html>
